esphome:
  name: downstairs-fireplace

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

# OpenThread configuration
network:
  enable_ipv6: true

openthread:
  device_type: FTD
  tlv: !secret thread_tlv
  force_dataset: true

# Expose ESPHome API so Home Assistant can communicate
api:

# Logging for debugging
logger:
  level: DEBUG

# OTA updates for firmware
ota:
  platform: esphome

# ===== I2C bus =====
i2c:
  id: bus_a
  sda: GPIO2
  scl: GPIO1
  scan: true
  frequency: 50000  # 50 kHz

# ===== Globals =====
globals:
  - id: motor_speed
    type: int
    initial_value: '32'  # DRV8830 speed bits (0x06–0x3F)

# ===== Buttons =====
button:
  - platform: template
    name: "Motor Forward Test"
    on_press:
      - lambda: |-
          uint8_t speed = id(motor_speed);
          if (speed > 63) speed = 63;  // VSET max is 63
          if (speed < 0) speed = 0;
          // DRV8830: Bits 7-2 = VSET[5:0], Bit 1 = IN2, Bit 0 = IN1
          // Forward: IN1=1, IN2=0
          uint8_t ctrl = (speed << 2) | 0x01; // FORWARD command
          uint8_t buf[2] = {0x00, ctrl};
          id(bus_a).write(0x60, buf, 2);
          ESP_LOGD("motor", "Forward command sent: speed=%d, ctrl=0x%02X", speed, ctrl);
      - delay: 2s
      - lambda: |-
          uint8_t buf[2] = {0x00, 0x00}; // Coast (IN1=0, IN2=0)
          id(bus_a).write(0x60, buf, 2);
          ESP_LOGD("motor", "Motor released after 2s");

  - platform: template
    name: "Motor Backward Test"
    on_press:
      - lambda: |-
          uint8_t speed = id(motor_speed);
          if (speed > 63) speed = 63;  // VSET max is 63
          if (speed < 0) speed = 0;
          // DRV8830: Bits 7-2 = VSET[5:0], Bit 1 = IN2, Bit 0 = IN1
          // Reverse: IN1=0, IN2=1
          uint8_t ctrl = (speed << 2) | 0x02; // REVERSE command
          uint8_t buf[2] = {0x00, ctrl};
          id(bus_a).write(0x60, buf, 2);
          ESP_LOGD("motor", "Backward command sent: speed=%d, ctrl=0x%02X", speed, ctrl);
      - delay: 2s
      - lambda: |-
          uint8_t buf[2] = {0x00, 0x00}; // Coast (IN1=0, IN2=0)
          id(bus_a).write(0x60, buf, 2);
          ESP_LOGD("motor", "Motor released after 2s");

  - platform: template
    name: "Motor Stop/Release"
    on_press:
      - lambda: |-
          uint8_t buf[2] = {0x00, 0x00}; // Coast (IN1=0, IN2=0)
          id(bus_a).write(0x60, buf, 2);
          ESP_LOGD("motor", "Motor released immediately");
