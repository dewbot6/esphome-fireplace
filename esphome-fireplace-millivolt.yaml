esphome:
  name: fireplace-millivolt
  name_add_mac_suffix: true
  # Device name used for hostname and entity IDs in Home Assistant
  on_boot:
    # Set status LED to red immediately on power-up before the first interval fires.
    # Priority -10 runs well after light components initialize (priority ~600),
    # so status_led is guaranteed ready.
    priority: -10
    then:
      - light.turn_on:
          id: status_led
          red: 1.0
          green: 0.0
          blue: 0.0
          brightness: 0.3
          transition_length: 0s

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

# =============================
# NETWORK CONFIGURATION
# =============================
# OpenThread configuration for Thread/Matter support
# Alternative: Use WiFi instead by uncommenting wifi section below
# and commenting out the openthread section
network:
  enable_ipv6: true

openthread:
  device_type: FTD
  tlv: !secret thread_tlv
  force_dataset: true

# Alternative WiFi configuration (uncomment to use WiFi instead of OpenThread):
# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password

# Expose ESPHome API so Home Assistant or Thread border router can communicate
api:

# Web server for easy debugging and control via browser
web_server:
  port: 80

# Logging level: DEBUG for troubleshooting, INFO for normal operation
logger:
  level: INFO
  # level: DEBUG  # Uncomment for detailed debugging

# OTA updates for firmware
ota:
  platform: esphome

# =============================
# RELAY SWITCH CONFIGURATION
# =============================
# Controls a relay that switches millivolt fireplace on/off
# Millivolt fireplaces use a simple on/off switch (no dimming)
switch:
  # Physical GPIO relay (hidden from UI - controlled by virtual switch)
  - platform: gpio
    pin:
      number: 2  # Change if using different GPIO pin
      inverted: false  # Set to true if relay is active-low
    id: fireplace_relay
    restore_mode: ALWAYS_OFF  # Always start with fireplace off for safety
    # No 'name' here keeps this hidden from Home Assistant UI
    # Only the virtual switch below is exposed

  # RGB LED power enable (M5NanoC6: GPIO19 must be HIGH for the WS2812 to receive power)
  # ALWAYS_ON ensures power is asserted during setup(), before write_state() ever fires.
  - platform: gpio
    pin: GPIO19
    id: rgb_pwr
    internal: true
    restore_mode: ALWAYS_ON

  # Virtual switch (exposed to Home Assistant/Apple Home)
  # This is the "smart" switch that users interact with
  # It controls the physical relay and manages the auto-off timer
  - platform: template
    name: "Fireplace"
    id: fireplace
    restore_mode: ALWAYS_OFF  # Always start with fireplace off for safety
    optimistic: true
    turn_on_action:
      - switch.turn_on: fireplace_relay
      - script.execute: auto_off_timer  # Start auto-off countdown
    turn_off_action:
      - switch.turn_off: fireplace_relay
      - script.stop: auto_off_timer  # Cancel auto-off timer

# =============================
# AUTO-OFF TIMER SCRIPT
# =============================
# Automatically turns off fireplace after configured time
# Timer restarts if fireplace is turned on again while running
script:
  - id: auto_off_timer
    mode: restart  # Restart timer if fireplace is turned on again
    then:
      - delay: !lambda |-
          // Convert hours to milliseconds
          return (uint32_t)(auto_off_hours->state * 3600000);
      - switch.turn_off: fireplace

# =============================
# CONFIGURABLE AUTO-OFF TIME
# =============================
# Set how many hours before fireplace automatically turns off
# Adjustable in Home Assistant for convenience
number:
  - platform: template
    name: "Fireplace Auto-Off Timer"
    id: auto_off_hours
    unit_of_measurement: "h"
    min_value: 0.5  # Minimum 30 minutes
    max_value: 12   # Maximum 12 hours
    step: 0.5
    initial_value: 6  # Default 6 hours
    restore_value: true  # Remember last setting
    optimistic: true

# =============================
# BOOT BUTTON CONFIGURATION
# =============================
# The M5NanoC6 BTN button (GPIO9, active-low with internal pullup) toggles
# the fireplace template switch so the auto-off timer logic runs as normal.
# 50 ms delayed_on filter eliminates contact-bounce false triggers.
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
      inverted: true
    id: boot_button
    internal: true
    filters:
      - delayed_on: 50ms
    on_press:
      - switch.toggle: fireplace

# =============================
# STATUS LED CONFIGURATION
# =============================
# M5NanoC6 onboard WS2812 RGB LED: signal on GPIO20, power enable on GPIO19.
# Shows Thread connectivity at a glance:
#   SOLID RED   - not connected to Thread network
#   SOLID GREEN - connected to Thread network
# Marked internal so it does not appear as a controllable entity in Home Assistant.
# esp32_rmt_led_strip is the correct driver for WS2812 under esp-idf (not neopixelbus).
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    name: "Status LED"
    pin: GPIO20
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    use_psram: false  # DevKitC-1 has no PSRAM; default true causes silent init failure

# =============================
# THREAD STATUS POLLING
# =============================
# Checks network connectivity every 2 seconds and updates the status LED.
# network::is_connected() returns true when OpenThread has routable connectivity;
# since OpenThread is the only network interface on this device, this is the
# correct and simplest connectivity check.
interval:
  - interval: 2s
    then:
      - lambda: |-
          bool connected = network::is_connected();
          auto call = id(status_led).turn_on();
          call.set_brightness(0.3f);
          call.set_transition_length(0);
          if (connected) {
            call.set_red(0.0f);
            call.set_green(1.0f);
            call.set_blue(0.0f);
          } else {
            call.set_red(1.0f);
            call.set_green(0.0f);
            call.set_blue(0.0f);
          }
          call.perform();
