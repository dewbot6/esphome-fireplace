esphome:
  name: fireplace

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

# OpenThread configuration
network:
  enable_ipv6: true

openthread:
  device_type: FTD
  tlv: !secret thread_tlv
  force_dataset: true

# Expose ESPHome API so Home Assistant or Thread border router can communicate
api:

# Logging for debugging
logger:

# OTA updates for firmware
ota:
  platform: esphome

################################
# SWITCHES
################################
switch:
  # 1. PHYSICAL RELAY (The "Muscle")
  - platform: gpio
    pin:
      number: 2
      inverted: false
    id: fireplace_relay
    restore_mode: ALWAYS_OFF
    # Note: No 'name' here keeps this hidden from the Home Assistant UI

  # 2. VIRTUAL SWITCH (The "Brain")
  - platform: template
    name: "Fireplace"
    id: fireplace
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action:
      - switch.turn_on: fireplace_relay
      - script.execute: auto_off_timer
    turn_off_action:
      - switch.turn_off: fireplace_relay
      - script.stop: auto_off_timer

################################
# AUTO-OFF TIMER SCRIPT
################################
script:
  - id: auto_off_timer
    mode: restart
    then:
      - delay: !lambda |-
          return (uint32_t)(auto_off_hours->state * 3600000);
      - switch.turn_off: fireplace

################################
# CONFIGURABLE AUTO-OFF TIME
################################
number:
  - platform: template
    name: "Fireplace Auto-Off Timer"
    id: auto_off_hours
    unit_of_measurement: "h"
    min_value: 0.5
    max_value: 12
    step: 0.5
    initial_value: 6
    restore_value: true
    optimistic: true
