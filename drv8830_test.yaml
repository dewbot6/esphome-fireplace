esphome:
  name: drv8830_test

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

# OpenThread configuration
network:
  enable_ipv6: true

openthread:
  device_type: FTD
  tlv: !secret thread_tlv
  force_dataset: true

# Expose ESPHome API so Home Assistant or Thread border router can communicate
api:

# Logging for debugging
logger:

# OTA updates for firmware
ota:
  platform: esphome

i2c:
  id: bus_a
  sda: GPIO2
  scl: GPIO1
  scan: true
  frequency: 50000

# ===== Globals =====
globals:
  - id: drv8830_instance
    type: esphome::drv8830::DRV8830*
    restore_value: false
    initial_value: 'nullptr'

# Create the DRV8830 component on boot
on_boot:
  then:
    - lambda: |-
        auto *drv = new esphome::drv8830::DRV8830(id(bus_a), 0x60);
        App.register_component(drv);
        id(drv8830_instance) = drv;
        ESP_LOGI("drv8830", "DRV8830 component registered");

# Example test switches
switch:
  - platform: template
    name: "Motor Forward 1s"
    turn_on_action:
      - lambda: |-
          auto *drv = id(drv8830_instance);
          if (drv != nullptr) {
            drv->set_motor(32, drv->FORWARD);
          }
      - delay: 1s
      - lambda: |-
          auto *drv = id(drv8830_instance);
          if (drv != nullptr) {
            drv->set_motor(0, drv->RELEASE);
          }

  - platform: template
    name: "Motor Backward 1s"
    turn_on_action:
      - lambda: |-
          auto *drv = id(drv8830_instance);
          if (drv != nullptr) {
            drv->set_motor(32, drv->BACKWARD);
          }
      - delay: 1s
      - lambda: |-
          auto *drv = id(drv8830_instance);
          if (drv != nullptr) {
            drv->set_motor(0, drv->RELEASE);
          }
